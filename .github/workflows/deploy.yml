name: Build si Deploy pe GitHub Pages

# 15.11.2026: aceeași metodă ca la beauty-healths.com. Site-ul construit se urcă direct pe GitHub Pages
# și NU se mai salvează în ramura gh-pages (aceea creștea depozitul cu ~15 MB pe zi).
# Domeniul casaatelier.website se setează în Settings → Pages → Custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instaleaza dependinte
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Configureaza GitHub Pages
        uses: actions/configure-pages@v5

      - name: Incarca artefact build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy pe GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
